# Copy to config.yaml and fill in.
# Any value may also be supplied via env var WORLDREVEAL_<UPPER_KEY>.

spreadsheet_id: "1GRqNKVDjwLYH8z9TRFP5QXV4FzuxXAajaHi82WPvdfc"
drive_root_folder_id: "1sdkRI76YygZpE_u8VDLPVuHlgOGP3WgX"

# Sheets whose tab name matches any of these are ignored.
skip_sheets:
  - "OTWTW V5"

# Column headers (case-sensitive, matched in row 1 of each tab).
columns:
  link: "Link"
  download_flag: "Download Video?"
  in_folder: "In Folder"
  drive_link: "Drive Link"    # created automatically if missing
  team_number: "Team Number"  # prefixed onto Drive filename: "<team>_<title>.mp4"

# How often the monitor sweeps the sheet, in seconds.
poll_interval_seconds: 300

# Max concurrent download+upload pipelines.
concurrency: 3

# Where yt-dlp writes files before they're uploaded. Cleared after each upload.
download_dir: "./downloads"

# Logging
log_level: "INFO"
log_file: "./logs/worldreveal.log"

# Optional: path to a Netscape-format YouTube cookies file.
# Required on datacenter IPs (Hetzner, AWS, etc.) because YouTube blocks
# anonymous requests with a bot challenge. On a residential IP (your Mac at
# home) you can leave this unset.
# See DEPLOY.md for how to export cookies from your browser.
# cookies_file: "./credentials/youtube_cookies.txt"

# Optional: HTTP/HTTPS/SOCKS proxy URL for yt-dlp only (Drive/Sheets don't
# need it). On datacenter IPs, a residential-IP proxy eliminates YouTube
# bot-flagging entirely and cookies become optional. Example providers:
# Webshare, Smartproxy, IPRoyal, Bright Data (~$3-30/mo for a few GB).
# Format:
#   http://user:pass@host:port
#   socks5://user:pass@host:port
# proxy: "http://user:pass@proxy.example.com:8080"
